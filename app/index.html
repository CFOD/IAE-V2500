<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'">
<title>V2500 Engine Simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage"><canvas id="stage3d"></canvas><canvas id="cutaway" hidden></canvas><div id="tip" hidden></div></div>
<button id="hudShow" title="Show the interface (H)">Show HUD</button>

<header id="top">
  <div class="brand"><b>V2500</b><span id="state">Cold</span><i id="clock">0:00</i></div>
  <div class="pill" id="viewbar">
    <div class="seg" id="viewMode"><button data-v="3d" class="on">3D</button><button data-v="2d">Section</button></div>
    <span class="sep"></span>
    <button id="btnCut" class="chip on">Cutaway</button>
    <button id="btnFlow" class="chip on">Flow</button>
    <button id="btnCowl" class="chip" title="Open the fan cowl doors and the thrust reverser C-ducts (key O)">Cowls</button>
    <label class="inline">Explode<input type="range" id="explode" min="0" max="1" step="0.01" value="0"></label>
    <span class="sep"></span>
    <div class="seg ghost" id="cams"><button data-v="hero">Overview</button><button data-v="front">Intake</button><button data-v="core">Core</button><button data-v="rear">Exhaust</button></div>
  </div>
  <div class="pill">
    <button id="btnPause" class="chip">Pause</button>
    <div class="seg ghost" id="speed"><button data-v="0.25">¼×</button><button data-v="1" class="on">1×</button><button data-v="4">4×</button><button data-v="10">10×</button></div>
    <span class="sep"></span>
    <button id="btnSound" class="chip">Sound</button>
    <button id="btnQ" class="chip" title="Medium: shadows, bloom, haze. High: adds ambient occlusion. Ultra: adds supersampling. Low: no effects.">Quality: Medium</button>
    <span class="sep"></span>
    <button id="btnCold" class="chip">Reset cold</button>
    <button id="btnIdle" class="chip">Reset at idle</button>
    <button id="btnDrawer" class="chip on">Panel</button>
    <button id="btnHud" class="chip" title="Hide the interface for a clear view of the engine (H)">Hide HUD</button>
  </div>
</header>

<aside id="partcard" class="glass">
  <div class="eyebrow">Component</div>
  <h2 id="pcName">Nothing selected</h2>
  <p id="pcDesc"></p>
  <div id="pcLive"></div>
  <div id="pcCtl"></div>
  <button id="pcRemove" class="btn" hidden>Remove part</button>
  <div id="removedWrap" hidden><div class="eyebrow">Removed</div><div id="removed"></div><button id="restoreAll" class="btn ghost">Refit all</button></div>
</aside>

<aside id="drawer" class="glass">
  <nav class="tabs" data-group="drawer"><button data-t="ctl" class="on">Control</button><button data-t="amb">Ambient</button><button data-t="hw">Hardware</button><button data-t="flt">Faults</button><button data-t="mon">Monitor</button></nav>
  <div class="tab on" id="t-ctl"></div>
  <div class="tab" id="t-amb"></div>
  <div class="tab" id="t-hw"></div>
  <div class="tab" id="t-flt"></div>
  <div class="tab" id="t-mon">
    <nav class="tabs sub" data-group="sd"><button data-t="maps" class="on">Compressor maps</button><button data-t="trend">Trends</button><button data-t="data">Stations</button><button data-t="log">Log</button></nav>
    <div class="tab on" id="t-maps"><canvas id="maps"></canvas></div>
    <div class="tab" id="t-trend"><canvas id="trend"></canvas></div>
    <div class="tab" id="t-data"><div id="data"></div></div>
    <div class="tab" id="t-log"><div id="log"></div></div>
  </div>
</aside>

<footer id="dock">
  <div id="status"></div>
  <div class="glass dockrow">
    <section class="ctrl">
      <div class="field"><span class="cap">Master</span><button id="master" class="switch" aria-pressed="false"><i></i></button></div>
      <div class="field"><span class="cap">Crank</span><button id="manStart" class="switch small" aria-pressed="false"><i></i></button></div>
      <div class="field"><span class="cap">Reverse</span><button id="reverser" class="switch" aria-pressed="false"><i></i></button></div>
      <div class="field"><span class="cap">Fire</span><button id="agent" class="chip" title="Discharge the fire bottle. Only works once the fuel is off.">Agent</button></div>
      <div class="field grow"><span class="cap">Rating</span><select id="rating"></select></div>
    </section>
    <section class="lever">
      <div class="cap">Thrust lever <output id="tlaOut">Idle</output></div>
      <input type="range" id="tla" min="0" max="1" step="0.005" value="0">
      <div class="ticks"><span style="left:0;transform:none">Idle</span><span style="left:55.6%">CL</span><span style="left:77.8%">MCT</span><span style="left:100%">TO</span></div>
    </section>
    <canvas id="ecam"></canvas>
  </div>
</footer>
<script type="module" src="main.js"></script>
</body>
</html>
