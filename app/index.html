<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'">
<title>V2500 Engine Simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage"><canvas id="stage3d"></canvas><canvas id="cutaway" hidden></canvas><div id="tip" hidden></div></div>
<button id="hudShow" title="Show the interface (H)">Show HUD</button>
<div id="loading" hidden><i></i><span>Loading the detailed engine model</span></div>

<div class="pill" id="camsPill"><div class="seg ghost" id="cams"><button data-v="hero">Overview</button><button data-v="front">Intake</button><button data-v="core">Core</button><button data-v="rear">Exhaust</button></div></div>
<header id="top">
  <div class="brand"><b>V2500</b><span id="state">Cold</span><i id="clock">0:00</i></div>
  <div class="pill" id="viewbar">
    <div class="seg" id="viewMode"><button data-v="3d" class="on">3D</button><button data-v="2d">Section</button></div>
    <span class="sep"></span>
    <button id="btnCut" class="chip on">Cutaway</button>
    <button id="btnFlow" class="chip on">Flow</button>
    <button id="btnCowl" class="chip" title="Open the fan cowl doors and the thrust reverser C-ducts (key O)">Cowls</button>
    <label class="inline">Explode<input type="range" id="explode" min="0" max="1" step="0.01" value="0"></label>
  </div>
  <div class="pill">
    <button id="btnPause" class="chip">Pause</button>
    <div class="seg ghost" id="speed"><button data-v="0.25">¼×</button><button data-v="1" class="on">1×</button><button data-v="4">4×</button><button data-v="10">10×</button></div>
    <span class="sep"></span>
    <div class="menu" id="soundMenu"><button id="btnSound" class="chip" aria-haspopup="true" aria-expanded="false">Sound</button><div class="pop glass" role="menu"><button id="sndToggle" role="menuitem">Sound on<small id="sndState">Synthesised from the simulation</small></button><button id="sndFolder" role="menuitem">Load recordings from a folder…<small>Pick the folder with sounds.json and the .wav files. They are read on your computer, nothing is uploaded.</small></button></div><input type="file" id="sndPick" webkitdirectory multiple hidden></div>
    <button id="btnQ" class="chip" title="Medium: shadows, bloom, haze. High: adds ambient occlusion. Ultra: adds supersampling. Low: no effects.">Quality: Medium</button>
    <span class="sep"></span>
    <div class="menu" id="resetMenu"><button id="btnReset" class="chip" aria-haspopup="true" aria-expanded="false">Reset</button><div class="pop glass" role="menu"><button id="btnCold" role="menuitem">Cold and dark<small>Engine stopped, switches off</small></button><button id="btnIdle" role="menuitem">Running at idle<small>Started, MODE back to NORM</small></button></div></div>
    <button id="btnDrawer" class="chip on">Panel</button>
    <button id="btnFull" class="chip" hidden title="Full screen (on a phone, also turns it sideways)">Full screen</button>
    <button id="btnHud" class="chip" title="Hide the interface for a clear view of the engine (H)">Hide HUD</button>
  </div>
</header>

<aside id="partcard" class="glass empty">
  <div id="pcHead" role="button" tabindex="0" aria-expanded="true" title="Collapse or expand"><div class="eyebrow">Component</div><h2 id="pcName">Nothing selected</h2><i class="chev" aria-hidden="true"></i></div>
  <div class="pc-body">
  <p id="pcDesc"></p>
  <div id="pcLive"></div>
  <div id="pcCtl"></div>
  <button id="pcRemove" class="btn" hidden>Remove part</button>
  </div>
  <div id="removedWrap" hidden><div class="eyebrow">Removed</div><div id="removed"></div><button id="restoreAll" class="btn ghost">Refit all</button></div>
</aside>

<aside id="drawer" class="glass">
  <nav class="tabs" data-group="drawer"><button data-t="ctl" class="on">Control</button><button data-t="amb">Ambient</button><button data-t="hw">Hardware</button><button data-t="flt">Faults</button><button data-t="mon">Monitor</button></nav>
  <div class="tab on" id="t-ctl"></div>
  <div class="tab" id="t-amb"></div>
  <div class="tab" id="t-hw"></div>
  <div class="tab" id="t-flt"></div>
  <div class="tab" id="t-mon">
    <nav class="tabs sub" data-group="sd"><button data-t="maps" class="on">Compressor maps</button><button data-t="trend">Trends</button><button data-t="data">Stations</button><button data-t="log">Log</button></nav>
    <div class="tab on" id="t-maps"><canvas id="maps"></canvas></div>
    <div class="tab" id="t-trend"><canvas id="trend"></canvas></div>
    <div class="tab" id="t-data"><div id="data"></div></div>
    <div class="tab" id="t-log"><div id="log"></div></div>
  </div>
</aside>

<footer id="dock">
  <div id="status"></div>
  <div class="glass dockrow">
    <section class="ctrl">
      <div class="field"><span class="cap">Eng mode</span><div class="seg" id="engMode" title="ENG MODE selector. IGN/START then MASTER ON starts the engine automatically. CRANK motors it with the ignition inhibited."><button data-v="crank">Crank</button><button data-v="norm" class="on">Norm</button><button data-v="ign">Ign / Start</button></div></div>
      <div class="field"><span class="cap">Man start</span><button id="manStart" class="switch" aria-pressed="false" title="ENG MAN START. Opens the start valve when MODE is at CRANK or IGN/START. With IGN/START, MASTER ON then gives a manual start: both igniters and no automatic abort."><i></i></button></div>
      <div class="field"><span class="cap">Master</span><button id="master" class="switch" aria-pressed="false" title="ENG MASTER (M). Opens the LP and HP fuel valves. Set it OFF to stop the engine or to reset a start fault."><i></i></button></div>
      <div class="field grow"><span class="cap">Rating</span><select id="rating"></select></div>
      <div class="field"><span class="cap">APU bleed</span><button id="apuBleed" class="switch" aria-pressed="true" title="Air for the starter. Shut it if the start valve will not close."><i></i></button></div>
      <div class="field"><span class="cap">Fire</span><button id="agent" class="chip" title="Discharge the fire bottle. Only works once the fuel is off.">Agent</button></div>
    </section>
    <section class="lever">
      <div class="cap">Thrust lever <output id="tlaOut">Idle</output></div>
      <input type="range" id="tla" min="-20" max="45" step="0.25" value="0" title="Thrust lever (arrow keys). Below idle it lifts into reverse: the reverser deploys, then reverse thrust builds once it is fully out.">
      <div class="ticks"><span style="left:0;transform:none">Rev</span><span style="left:30.77%">Idle</span><span style="left:69.23%">CL</span><span class="mct" style="left:84.62%">MCT</span><span style="left:100%;transform:translateX(-100%)">TO</span></div>
    </section>
    <canvas id="ecam"></canvas>
  </div>
</footer>
<script type="module" src="main.js"></script>
</body>
</html>
